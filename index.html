<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Pong Oyunu</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Michroma&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="scoreboard">
      <div class="user">
        <p>User</p>
        <p id="userScore">0</p>
      </div>
      <div class="pc">
        <p>Computer</p>
        <div id="computerScore">0</div>
      </div>
    </div>
    <div class="game-container">
      <canvas id="gameCanvas"></canvas>
      <div class="controls-container">
        <div class="controls">
          <button id="pauseBtn"><i class="fas fa-pause"></i> Duraklat</button>
          <button id="restartBtn">
            <i class="fas fa-redo"></i> Yeniden Başlat
          </button>
          <button id="settingsBtn"><i class="fas fa-cog"></i> Ayarlar</button>
        </div>
        <div id="manuelControl">
          <button id="upBtn"><i class="fas fa-arrow-up"></i></button>
          <button id="downBtn"><i class="fas fa-arrow-down"></i></button>
        </div>
      </div>
      <div class="controls-mobile">
        <p>
          🎮 Çubuğu hareket ettirmek için oyun ekranının üst ve alt kısımlarına
          dokunun. Hızlı ve çevik ol!
        </p>
      </div>

      <!-- Level Seçim Menüsü -->
      <div id="levelMenu" class="menu-container">
        <h1>PONG OYUNU</h1>
        <p>Zorluk seviyesini seç ve oyuna başla!</p>
        <div class="level-buttons" style="display: flex; gap: 10px">
          <button class="game-btn" onclick="startGame('kolay')">
            <i class="fas fa-smile"></i> Kolay
          </button>
          <button class="game-btn" onclick="startGame('orta')">
            <i class="fas fa-meh"></i> Orta
          </button>
          <button class="game-btn" onclick="startGame('zor')">
            <i class="fas fa-frown"></i> Zor
          </button>
        </div>
      </div>

      <!-- Ayarlar Menüsü -->
      <div id="settingsMenu" class="menu-container" style="display: none">
        <div class="settings-content">
          <h3>Ayarlar</h3>
          <label>
            Top Rengi:
            <input type="color" id="ballColor" value="#ffffff" />
          </label>
          <label>
            Raket Rengi:
            <input type="color" id="paddleColor" value="#ff0000" />
          </label>
          <label>
            Arka Plan Teması:
            <select id="bgTheme">
              <option value="black">Siyah</option>
              <option value="stars">Yıldızlar</option>
              <option value="energy">Enerji</option>
            </select>
          </label>
          <label>
            Müzik:
            <select id="musicSelect">
              <option value="none">Müzik Yok</option>
              <option value="backgroundMusic.mp3">Game Sound NAV</option>
              <option value="cupMusic2.wav">Cup Sound NAV</option>
            </select>
          </label>
          <label>
            Ses Efektleri Ses Düzeyi:
            <input
              type="range"
              id="sfxVolume"
              min="0"
              max="1"
              step="0.1"
              value="0.5"
            />
          </label>
          <label>
            Mobil Kontrol Düzeni:
            <select id="controlLayoutSelect">
              <option value="sideBySide">Yan Yana (Alt)</option>
              <option value="stackedRight">Sağda Alt Alta</option>
            </select>
          </label>
          <button id="closeSettingsBtn">Kapat</button>
        </div>
      </div>
      <footer class="footer">
        <p>PONG GAME</p>
      </footer>
    </div>

    <script src="js/functions.js"></script>
  </body>
</html>
